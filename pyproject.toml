[project]
name = "front-office"
version = "0.1.0"
description = "Multi-agent NBA front office: CBA-compliant trade proposals with a deterministic rules engine, a trained valuation model and a custom MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "nba_api>=1.5",
    "tenacity>=9.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mcp[cli]>=2.3.0",
    "feedparser>=6.0.14",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langfuse>=5.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.2",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rules", "models", "mcp_server", "agents", "data", "evals", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline HTML fixtures
"reports/*" = ["E501"]  # page copy and labels
"rules/**" = ["E501"]  # violation messages
"evals/**" = ["E501"]  # prompts and case fixtures
"models/**" = ["E501"]  # SQL and feature labels
"mcp_server/**" = ["E501"]  # tool descriptions read by LLMs
"agents/**" = ["E501"]  # prompts and fact sheets

[tool.pytest.ini_options]
testpaths = ["tests", "rules/tests", "models/tests", "mcp_server/tests", "agents/tests"]
markers = [
    "integration: needs network or the full warehouse",
]
addopts = "-m 'not integration'"
